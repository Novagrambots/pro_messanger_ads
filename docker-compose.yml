name: 'pro_messanger ads backend'

services:
  db:
    image: postgres:15-alpine
    container_name: channel_db_2
    # Креды берутся из .env (compose подставляет ${...} автоматически), не хардкодим в репозитории.
    # Порт наружу НЕ публикуем — база доступна только внутри docker-сети по имени 'db'.
    environment:
      POSTGRES_DB: ${DATABASES_NAME}
      POSTGRES_USER: ${DATABASES_USER}
      POSTGRES_PASSWORD: ${DATABASES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck: # Проверка готовности базы
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASES_USER} -d ${DATABASES_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: channel_redis
    restart: unless-stopped

  # Redis выдачи объявлений v2: бюджеты, счётчики показов, несброшенные траты (деньги!).
  # AOF раз в секунду — после рестарта данные на месте; noeviction — при переполнении памяти
  # Redis отказывает в записи, а не выкидывает ключи бюджета. Отдельно от брокера Celery и кэша
  redis_ads:
    image: redis:7-alpine
    container_name: channel_redis_ads
    command: >
      redis-server --appendonly yes --appendfsync everysec
      --maxmemory ${ADS_REDIS_MAXMEMORY:-8gb} --maxmemory-policy noeviction
    volumes:
      - redis_ads_data:/data
    restart: unless-stopped

  web:
    build: .
    container_name: channel_web_2
    command: >
      sh -c "
        echo 'Ждем базу данных...' &&
        sleep 5 &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn --bind 0.0.0.0:9000 --worker-class gthread --workers 4 --threads 8 --timeout 60 core.wsgi:application
      "
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - geo_data:/app/data  # гео-база DB-IP (качает celery_worker раз в месяц)
      # Сервисный ключ Firebase для push (лежит рядом с проектом, в git не коммитится).
      # ВАЖНО: файл должен лежать на хосте ДО docker compose up — иначе docker создаст ПАПКУ firebase.json
      - ./firebase.json:/app/firebase.json:ro
    # Все переменные (SECRET_KEY, DEBUG, ALLOWED_HOSTS, DATABASES_*) приходят из .env через env_file.
    # Порт наружу НЕ публикуем — доступ к Django только через nginx.
    env_file:
      - .env
    environment:
      # Настройки для Celery внутри Docker (хост - имя сервиса 'redis')
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CACHE_REDIS_URL=redis://redis:6379/1  # общий кэш Django (справочники, троттлинг)
      - ADS_REDIS_URL=redis://redis_ads:6379/0  # выдача v2: возвраты и пополнения сначала сбрасывают показы
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      redis_ads:
        condition: service_started
    restart: unless-stopped

  # Горячий путь выдачи объявлений v2 (/api/ads/serve|events|report/) — отдельно от web, чтобы
  # пик запросов рекламы не съедал воркеры кабинета и модерации. Тот же образ, только эти URL.
  # Ядра, воркеры и потоки — из .env (SERVING_CPUS / SERVING_WORKERS / SERVING_THREADS)
  serving:
    build: .
    container_name: channel_serving
    command: >
      gunicorn --bind 0.0.0.0:9100 --worker-class gthread
      --workers ${SERVING_WORKERS:-8} --threads ${SERVING_THREADS:-4} --timeout 30
      core.wsgi:application
    cpus: ${SERVING_CPUS:-8}
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    volumes:
      - geo_data:/app/data:ro  # гео-база DB-IP: страна и город зрителя по IP
    env_file:
      - .env
    environment:
      - SERVING_ONLY=True
      - DATABASES_CONN_MAX_AGE=0  # в базу — только снимок объявлений раз в 30 с и редкие жалобы
      - ADS_REDIS_URL=redis://redis_ads:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CACHE_REDIS_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis_ads
      - web  # миграции применяет web
    restart: unless-stopped

  celery_worker:
    build: .
    container_name: channel_worker
    # concurrency ограничиваем явно: без него celery берёт пул на число ядер хоста,
    # а на многоконтейнерном сервере это выбивает лимит file descriptors (EMFILE).
    # Двух воркеров хватает для конвертации медиа и чистки. nofile — страховка сверху.
    # Очереди: по умолчанию (деньги, уведомления, чистка) и media (перекодирование видео).
    # Сброс показов (serving_flush) — в отдельном воркере celery_flush
    command: celery -A core worker -l info --concurrency=2 -Q celery,media
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    volumes:
      - media_volume:/app/media # ОБЯЗАТЕЛЬНО: воркер должен видеть файлы, чтобы удалить их
      - geo_data:/app/data # гео-база DB-IP: воркер раз в месяц скачивает свежую
      - ./firebase.json:/app/firebase.json:ro # push шлёт именно воркер
    env_file:
      - .env
    environment:
      - DEBUG=False
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CACHE_REDIS_URL=redis://redis:6379/1  # общий кэш Django (справочники, троттлинг)
      - ADS_REDIS_URL=redis://redis_ads:6379/0
    depends_on:
      - db
      - redis
      - redis_ads
      - web # Чтобы миграции точно прошли до запуска воркера
    restart: unless-stopped

  # Сброс показов объявлений v2 из Redis в Postgres (beat каждые 5 с) — своя очередь и свой
  # воркер, чтобы перекодирование видео и прочие задачи его не задерживали. Один процесс:
  # сбросы и так идут по одному (замок в Redis). -l warning — без строки в лог каждые 5 с
  celery_flush:
    build: .
    container_name: channel_flush
    command: celery -A core worker -l warning -Q serving_flush --concurrency=1
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    env_file:
      - .env
    environment:
      - DEBUG=False
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CACHE_REDIS_URL=redis://redis:6379/1
      - ADS_REDIS_URL=redis://redis_ads:6379/0
    depends_on:
      - db
      - redis
      - redis_ads
      - web # миграции применяет web
    restart: unless-stopped

  celery_beat:
    build: .
    container_name: channel_beat
    command: celery -A core beat -l info
    env_file:
      - .env
    environment:
      - DEBUG=False
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CACHE_REDIS_URL=redis://redis:6379/1  # общий кэш Django (справочники, троттлинг)
      - ADS_REDIS_URL=redis://redis_ads:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: channel_nginx_2
    # Слушаем только локально на 18080. Наружу домен отдаёт системный nginx хоста,
    # который проксирует ads-api.vipads.uz -> 127.0.0.1:18080.
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
      - serving
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
  redis_ads_data:
  geo_data: