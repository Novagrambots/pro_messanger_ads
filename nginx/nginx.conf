events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # nginx >= 1.29.7 по умолчанию держит keep-alive к upstream (HTTP/1.1, простаивающее соединение — до 60 с),
    # а gunicorn закрывает простаивающее соединение уже через 2 с (--keep-alive по умолчанию). Если nginx
    # отправит запрос в соединение, которое gunicorn в этот момент закрывает, — «Connection reset by peer» /
    # «upstream prematurely closed connection» и 502 клиенту (POST nginx не повторяет). Поэтому простаивающие
    # соединения закрывает nginx — раньше gunicorn: keepalive_timeout 1s < 2 с у gunicorn.
    upstream django {
        server web:9000;
        keepalive 32;
        keepalive_timeout 1s;
    }

    # Горячий путь выдачи объявлений v2 — отдельный сервис serving
    upstream serving {
        server serving:9100;
        keepalive 32;
        keepalive_timeout 1s;
    }

    # Если хостовый nginx передал X-Forwarded-Proto — используем его, иначе схему запроса.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        "~."    $http_x_forwarded_proto;
    }

    server {
        listen 80;
        server_name ads-api.vipads.uz;

        location /static/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Файлы в /media/ не меняются под тем же именем (UUID, у аватаров — хэш содержимого),
        # поэтому кэшируем «навсегда» — и в браузере, и в Cloudflare
        location /media/ {
            alias /app/media/;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Accept-Ranges bytes;
        }

        # Запрос рекламы, события и жалобы из приложения → serving (остальное /api/ads/ — в web)
        location ~ ^/api/ads/(serve|events|report)/$ {
            proxy_pass http://serving;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_redirect off;
        }

        location / {
            proxy_pass http://django/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Пробрасываем оригинальную схему от хостового nginx (там терминируется TLS).
            # Если заголовка нет (прямой заход на 18080) — берём схему текущего запроса.
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_redirect off;

            # Для больших файлов (загрузка видео)
            client_max_body_size 100M;
        }
    }
}
